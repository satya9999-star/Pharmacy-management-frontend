name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          rm -f package-lock.json
          npm install

      - name: Build Angular Application
        run: npm run build -- --configuration production --base-href /Pharmacy-management-frontend/

      - name: Add 404.html & .nojekyll for GitHub Pages SPA Routing
        run: |
          cp ./dist/pharmacy-frontend/browser/index.html ./dist/pharmacy-frontend/browser/404.html
          touch ./dist/pharmacy-frontend/browser/.nojekyll

      - name: Deploy to gh-pages branch (Automatic Branch Deploy)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/pharmacy-frontend/browser

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/pharmacy-frontend/browser

      - name: Deploy to GitHub Pages (Direct Actions Deploy)
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
